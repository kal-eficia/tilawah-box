<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#f7f5f0"/>
  <text x="48" y="64" font-size="30" font-weight="700" fill="#13294b" font-family="Georgia, serif">Tilawah Box wiring</text>
  <text x="48" y="94" font-size="15" fill="#46546a">BCM pin numbers. Every button and the dial connect between a GPIO pin and ground (GND); no resistors needed.</text>

  <!-- Raspberry Pi -->
  <rect x="440" y="150" width="320" height="430" rx="22" fill="#0f8b8d"/>
  <rect x="460" y="170" width="280" height="390" rx="14" fill="#0c6e70"/>
  <text x="600" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Raspberry Pi</text>
  <text x="600" y="238" text-anchor="middle" font-size="13" fill="#cfecea">Zero 2 W, 3, 4 or 5</text>
  <g font-size="14" fill="#fff" font-family="JetBrains Mono, Menlo, monospace">
    <text x="480" y="290">GPIO 17</text><text x="480" y="320">GPIO 27</text><text x="480" y="350">GPIO 22</text>
    <text x="480" y="410">GPIO 5</text><text x="480" y="440">GPIO 6</text>
    <text x="640" y="290">GPIO 13</text><text x="640" y="320">GPIO 19</text>
    <text x="640" y="410">SPI0 + 3V3</text><text x="640" y="440">GPIO 25</text>
    <text x="480" y="520">GND (any)</text><text x="640" y="520">USB / I2S</text>
  </g>

  <!-- Dial -->
  <g>
    <rect x="60" y="250" width="240" height="120" rx="16" fill="#fff" stroke="#e4e0d6" stroke-width="2"/>
    <circle cx="112" cy="310" r="32" fill="#13294b"/><circle cx="112" cy="310" r="10" fill="#c99a2e"/>
    <text x="160" y="292" font-size="16" font-weight="700" fill="#13294b">Rotary dial</text>
    <text x="160" y="314" font-size="13" fill="#46546a">turn: choose surah</text>
    <text x="160" y="334" font-size="13" fill="#46546a">press: play / pause</text>
    <path d="M300 285 H470" stroke="#13294b" stroke-width="2.5"/><path d="M300 315 H470" stroke="#13294b" stroke-width="2.5"/>
    <path d="M300 345 H470" stroke="#c99a2e" stroke-width="2.5"/>
    <text x="312" y="279" font-size="12" fill="#46546a">A</text><text x="312" y="309" font-size="12" fill="#46546a">B</text><text x="312" y="339" font-size="12" fill="#46546a">SW</text>
  </g>

  <!-- Buttons left -->
  <g>
    <rect x="60" y="390" width="240" height="70" rx="14" fill="#fff" stroke="#e4e0d6" stroke-width="2"/>
    <circle cx="96" cy="425" r="16" fill="#e0614a"/>
    <text x="126" y="420" font-size="15" font-weight="700" fill="#13294b">Reciter</text>
    <text x="126" y="440" font-size="13" fill="#46546a">next reciter</text>
    <path d="M300 405 H470" stroke="#e0614a" stroke-width="2.5"/>
    <rect x="60" y="470" width="240" height="70" rx="14" fill="#fff" stroke="#e4e0d6" stroke-width="2"/>
    <circle cx="96" cy="505" r="16" fill="#0f8b8d"/>
    <text x="126" y="500" font-size="15" font-weight="700" fill="#13294b">Hifz</text>
    <text x="126" y="520" font-size="13" fill="#46546a">repeat each ayah 1, 3, 5, 10</text>
    <path d="M300 505 C380 505 400 436 470 436" stroke="#0f8b8d" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Right side -->
  <g>
    <rect x="900" y="250" width="240" height="90" rx="14" fill="#fff" stroke="#e4e0d6" stroke-width="2"/>
    <circle cx="936" cy="280" r="13" fill="#46546a"/><circle cx="936" cy="312" r="13" fill="#46546a"/>
    <text x="931" y="285" font-size="16" font-weight="700" fill="#fff">-</text><text x="930" y="318" font-size="16" font-weight="700" fill="#fff">+</text>
    <text x="964" y="290" font-size="15" font-weight="700" fill="#13294b">Volume</text>
    <text x="964" y="312" font-size="13" fill="#46546a">down / up, capped</text>
    <path d="M900 285 H760" stroke="#46546a" stroke-width="2.5"/><path d="M900 315 H760" stroke="#46546a" stroke-width="2.5"/>

    <rect x="900" y="370" width="240" height="90" rx="14" fill="#fff" stroke="#e4e0d6" stroke-width="2"/>
    <rect x="924" y="392" width="44" height="44" rx="8" fill="#13294b"/><path d="M936 414 q10 -12 20 0 M940 414 q6 -7 12 0" stroke="#c99a2e" stroke-width="2.2" fill="none"/>
    <text x="984" y="408" font-size="15" font-weight="700" fill="#13294b">NFC reader</text>
    <text x="984" y="430" font-size="13" fill="#46546a">RC522, optional: tap</text>
    <text x="984" y="448" font-size="13" fill="#46546a">a card to play a surah</text>
    <path d="M900 405 H760 M900 436 H760" stroke="#13294b" stroke-width="2.5"/>

    <rect x="900" y="490" width="240" height="80" rx="14" fill="#fff" stroke="#e4e0d6" stroke-width="2"/>
    <path d="M928 512 h14 l16 -12 v44 l-16 -12 h-14 z" fill="#13294b"/>
    <path d="M968 514 q8 8 0 16 M974 508 q14 14 0 28" stroke="#13294b" stroke-width="2.2" fill="none"/>
    <text x="992" y="524" font-size="15" font-weight="700" fill="#13294b">Speaker</text>
    <text x="992" y="546" font-size="13" fill="#46546a">USB or I2S amp</text>
    <path d="M900 520 H760" stroke="#13294b" stroke-width="2.5"/>
  </g>

  <!-- ground bus -->
  <path d="M300 560 C380 570 420 516 470 516" stroke="#888" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <text x="60" y="600" font-size="13" fill="#46546a">Dashed: all buttons and the dial share one ground wire.</text>

  <text x="48" y="650" font-size="14" fill="#46546a">No screen by design. A short chime confirms each press; the recitation itself tells you where you are.</text>
</svg>
